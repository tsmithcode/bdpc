<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,noimageindex,nosnippet">
  <meta http-equiv="Cache-Control" content="no-store, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="referrer" content="no-referrer">
  <title>Private Project Access Closed</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f3f6f7;
      color: #17364b;
    }
    main {
      width: min(620px, 100%);
      padding: 36px;
      border: 1px solid #cad7dc;
      border-top: 5px solid #174d6b;
      background: #fff;
      box-shadow: 0 18px 44px rgba(23, 54, 75, .08);
    }
    .eyebrow {
      margin: 0 0 12px;
      color: #287fa3;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
    }
    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 52px);
      line-height: 1;
      letter-spacing: -.045em;
    }
    p {
      margin: 18px 0 0;
      color: #526773;
      font-size: 16px;
      line-height: 1.55;
    }
    .small {
      padding-top: 18px;
      border-top: 1px solid #dbe3e6;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">PRIVATE PROJECT RECORD</p>
    <h1>Public access is closed.</h1>
    <p>This route no longer forwards to client or project materials.</p>
    <p class="small">Authorized recipients must use the separately issued private access channel. No project files are available from this page.</p>
  </main>
</body>
</html>
