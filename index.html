<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Plan Grid for BDPC is coming soon. Awarded SOW and invoice records remain available.">
  <meta name="theme-color" content="#0b1220">
  <link rel="icon" href="data:,">
  <title>Plan Grid — BDPC</title>
  <style>
    :root{--ink:#101828;--muted:#667085;--line:#d0d5dd;--navy:#0b1220;--green:#147a4b;--green-soft:#ecfdf3}
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{margin:0;display:grid;place-items:center;padding:24px;background:#eef2f6;color:var(--ink);font:15px/1.5 Arial,"Segoe UI",sans-serif}
    main{width:min(620px,100%);padding:42px;border-top:8px solid var(--green);border-radius:18px;background:#fff;box-shadow:0 20px 60px rgba(15,23,42,.12)}
    .mark{display:grid;grid-template-columns:repeat(3,10px);gap:4px;width:max-content;margin-bottom:24px}
    .mark span{width:10px;height:10px;border:1px solid var(--green);border-radius:2px;background:var(--green-soft)}
    .mark span:nth-child(2),.mark span:nth-child(5),.mark span:nth-child(8){background:var(--green)}
    .eyebrow{color:var(--green);font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:8px 0 10px;font-size:44px;line-height:1;letter-spacing:-.04em}
    p{margin:0;color:var(--muted);font-size:16px}
    .status{display:inline-flex;margin-top:18px;padding:6px 9px;border-radius:999px;background:var(--green-soft);color:var(--green);font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:10px 15px;border:1px solid var(--green);border-radius:999px;background:var(--green);color:#fff;font-weight:800;text-decoration:none}
    footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
    @media(max-width:560px){main{padding:30px 24px}h1{font-size:38px}}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="eyebrow">CAD Guardian LLC × BDPC Architects</div>
    <h1>Plan Grid</h1>
    <p>A simplified project-control experience for BDPC is coming soon. Existing awarded SOW and invoice records remain available.</p>
    <span class="status">Coming soon</span>
    <div class="actions"><a href="/bdpc/sow/">Open commercial records →</a></div>
    <footer>Plan Grid by CAD Guardian LLC</footer>
  </main>
</body>
</html>
