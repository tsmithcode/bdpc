name: Promote CAD Guardian engagement workflows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/promote-cadguardian-engagement-workflows.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-cadguardian-engagement-workflows
  cancel-in-progress: false

jobs:
  promote-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote reviewed subsite from deployment branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin cadguardian-engagement-workflows-deploy
          git checkout origin/cadguardian-engagement-workflows-deploy -- cadguardian-engagement-workflows
          git checkout origin/cadguardian-engagement-workflows-deploy -- .github/workflows/sync-gh-pages.yml
          git add cadguardian-engagement-workflows .github/workflows/sync-gh-pages.yml
          if ! git diff --cached --quiet; then
            git commit -m "Publish CAD Guardian paid engagement workflow command center"
            git push origin HEAD:main
          fi

      - name: Publish complete canonical tree to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          rsync -a --delete --exclude='.git' ./ /tmp/gh-pages/
          cd /tmp/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages already matches canonical main."
            exit 0
          fi
          git commit -m "Publish CAD Guardian engagement workflows to GitHub Pages"
          git push origin HEAD:gh-pages
