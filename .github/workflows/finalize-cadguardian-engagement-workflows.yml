name: Finalize CAD Guardian engagement workflow deployment

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-cadguardian-engagement-workflows.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify promoted corpus before cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f cadguardian-engagement-workflows/index.html
          test -f cadguardian-engagement-workflows/data/corpus.json
          python - <<'PY'
          import json
          from pathlib import Path
          corpus = json.loads(Path('cadguardian-engagement-workflows/data/corpus.json').read_text())
          operations = json.loads(Path('cadguardian-engagement-workflows/data/operations.json').read_text())
          assert len(corpus['workflows']) == 14
          assert {'stripe','ivr','sales','opportunityExample'} <= operations.keys()
          PY

      - name: Close superseded deployment PR and delete staging branch
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head cadguardian-engagement-workflows-deploy --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$PR_NUMBER" ]]; then
            gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Published and verified through the canonical main-to-Pages release path. Closing the staging PR after promotion."
          fi
          git push origin --delete cadguardian-engagement-workflows-deploy || true

      - name: Remove one-time release workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/promote-cadguardian-engagement-workflows.yml
          git rm -f .github/workflows/finalize-cadguardian-engagement-workflows.yml
          git commit -m "Finalize CAD Guardian engagement workflow release"
          git push origin HEAD:main

      - name: Reconcile final canonical tree to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          rsync -a --delete --exclude='.git' ./ /tmp/gh-pages/
          cd /tmp/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Reconcile finalized CAD Guardian Pages release"
            git push origin HEAD:gh-pages
          fi
